name: Update PU Syllabus Data

on:
  workflow_dispatch:
  schedule:
    # Runs every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  update-syllabus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf

      - name: Create data directories
        run: |
          mkdir -p data/source-pdfs
          mkdir -p data/syllabus/ba

      - name: Download BA DSC Sem 1-2
        run: |
          curl -L \
            "https://puchd.ac.in/includes/syllabus/2026/20260702111502-b.a.b.a.hons.b.a.hons.withres.1.pdf?2026" \
            -o data/source-pdfs/ba-dsc-sem-1-2.pdf

      - name: Download BA DSC Sem 3-4
        run: |
          curl -L \
            "https://puchd.ac.in/includes/syllabus/2026/20260702111839-b.a.-b.ahons-b.a.honswithres.2.pdf?2026" \
            -o data/source-pdfs/ba-dsc-sem-3-4.pdf

      - name: Download BA DSC Sem 5-6
        run: |
          curl -L \
            "https://puchd.ac.in/includes/syllabus/2026/20260720161649-b.a.-b.ahons-b.a.honswithresearch.pdf?2026" \
            -o data/source-pdfs/ba-dsc-sem-5-6.pdf

      - name: Download BA DSC Sem 7-8
        run: |
          curl -L \
            "https://puchd.ac.in/includes/syllabus/2026/20260810121152-b.a.honswithres7th8thsem2026-27.pdf?2026" \
            -o data/source-pdfs/ba-dsc-sem-7-8.pdf

      - name: Verify downloaded PDFs
        run: |
          ls -lh data/source-pdfs/
          python - <<'PY'
          from pathlib import Path

          for p in Path("data/source-pdfs").glob("*.pdf"):
              size = p.stat().st_size
              print(f"{p}: {size:,} bytes")
              if size < 10_000:
                  raise SystemExit(f"Downloaded file looks invalid: {p}")
          PY

      - name: Commit source PDFs if changed
        run: |
          git config user.name "College Syllabus Buddy Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/source-pdfs/

          if git diff --cached --quiet; then
            echo "No source PDF changes detected."
          else
            git commit -m "chore: update PU BA DSC source PDFs"
            git push
          fi
